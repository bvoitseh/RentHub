# Optional override (D-47): attach the backend to an existing Docker network on which the PostgreSQL container runs,
# e.g. DB_URL=jdbc:postgresql://<postgres-container-name>:5432/renthub and PG_NETWORK=<network name> in prod.env.
#
#   docker compose --env-file prod.env -f docker-compose.prod.yml -f docker-compose.prod.pgnet.yml up -d --build
services:
  backend:
    networks:
      - default
      - pg

networks:
  pg:
    external: true
    name: ${PG_NETWORK:?set PG_NETWORK in prod.env}
