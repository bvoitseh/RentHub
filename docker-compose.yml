# Local infrastructure: PostgreSQL (the database), Redis (rate limits, e-mail link tokens, geocoding cache) and
# SeaweedFS as S3-compatible object storage (listing photos); all required by the backend. E-mail goes to a real SMTP relay.
# Usage: docker compose up -d postgres redis s3 s3-init
services:
  # PostgreSQL (PostgreSQL License), the only database (D-54). Local development credentials only.
  postgres:
    image: postgres:18-alpine
    container_name: renthub-postgres
    environment:
      POSTGRES_DB: renthub
      POSTGRES_USER: renthub
      POSTGRES_PASSWORD: renthub
    ports:
      - "5433:5432"   # host port 5433, so a PostgreSQL already installed on 5432 does not clash
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renthub -d renthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.11-alpine
    container_name: renthub-redis
    command: redis-server --save 60 1 --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for listing photos (FR-4a): SeaweedFS, Apache-2.0 (DECISIONS.md D-33).
  # Credentials and anonymous read access are defined in infra/seaweedfs/s3.json (local development only).
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: renthub-s3
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API; photos are publicly readable at http://localhost:8333/renthub-photos/<key>
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot job: creates the photos bucket and uploads the demo photos (safe to re-run; retries until the server is up).
  s3-init:
    image: chrislusf/seaweedfs:4.50
    container_name: renthub-s3-init
    depends_on:
      - s3
    environment:
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
    volumes:
      - ./infra/seaweedfs/create-bucket.sh:/create-bucket.sh:ro
      - ./infra/seed/photos:/seed-photos:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]

volumes:
  postgres-data:
  redis-data:
  s3-data:
