# Local infrastructure for development: PostgreSQL (optional, the dev profile uses H2 by default),
# MinIO as S3-compatible object storage and Mailpit as an SMTP catcher with a web UI.
# Usage: docker compose up -d postgres minio mailpit
services:
  postgres:
    image: postgres:17-alpine
    container_name: renthub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renthub}
      POSTGRES_USER: ${POSTGRES_USER:-renthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renthub}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renthub} -d ${POSTGRES_DB:-renthub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: renthub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: creates the photos bucket and makes it publicly readable (photo URLs are public, FR-4a).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: renthub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET
      "

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: renthub-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
