# Local infrastructure: Redis (rate limits and e-mail link tokens, required by the backend) and MinIO as
# S3-compatible object storage (catalogue photos). The database is embedded H2 and e-mail goes to a real SMTP relay.
# Usage: docker compose up -d redis minio
services:
  redis:
    image: redis:8.2.11-alpine
    container_name: renthub-redis
    command: redis-server --save 60 1 --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: renthub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: creates the photos bucket and makes it publicly readable (photo URLs are public, FR-4a).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: renthub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET
      "

volumes:
  redis-data:
  minio-data:
