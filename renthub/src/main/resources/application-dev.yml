# Local development: embedded H2 in PostgreSQL mode (file-based so data survives restarts),
# H2 console, Swagger UI, Mailpit (docker compose) as the SMTP catcher.
spring:
  datasource:
    url: jdbc:h2:file:./data/renthub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.bohakka.renthub: DEBUG
