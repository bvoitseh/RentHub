spring:
  application:
    name: renthub
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: uk
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
    scheduling:
      thread-name-prefix: sched-
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: RENTHUB_SESSION
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # E-mail is an asynchronous, best-effort side effect; an unreachable SMTP server must not mark the app DOWN.
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  time-zone: Europe/Kyiv
  mail-from: ${MAIL_FROM:noreply@renthub.local}
