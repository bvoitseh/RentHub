# Single configuration (no Spring profiles, see DECISIONS.md D-17): embedded H2 in PostgreSQL mode (file-based so data
# survives restarts), H2 console, Swagger UI, e-mail through an SMTP relay configured by the SMTP_* variables (dev.env).
spring:
  application:
    name: renthub
  datasource:
    url: jdbc:h2:file:./data/renthub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: uk
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
    scheduling:
      thread-name-prefix: sched-
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: RENTHUB_SESSION
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # E-mail is an asynchronous, best-effort side effect; an unreachable SMTP server must not mark the app DOWN.
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.bohakka.renthub: DEBUG

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  time-zone: Europe/Kyiv
  # FR-2a: first administrator, created at start-up only when no ADMIN exists and all three are set.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:}
  # NFR-14: "limit" attempts per "window"; reaching the limit locks the key for another window.
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window: 15m
    registration:
      limit: ${RATE_LIMIT_REGISTRATION:5}
      window: 1h
    password-reset:
      limit: ${RATE_LIMIT_PASSWORD_RESET:3}
      window: 1h
    resend-verification:
      limit: ${RATE_LIMIT_RESEND_VERIFICATION:3}
      window: 1h
