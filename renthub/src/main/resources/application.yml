# Single configuration without Spring profiles (DECISIONS.md D-17, D-47, D-54). PostgreSQL only: locally the
# docker-compose "postgres" service (defaults below), DEBUG logs. Production sets DB_URL / DB_USERNAME / DB_PASSWORD,
# LOG_LEVEL=INFO and the other variables in the server's .env (README, "Deploy").
spring:
  application:
    name: renthub
  config:
    # Configuration and secrets from the git-ignored repository-root .env (D-55; Java .properties syntax),
    # whichever of the two is found from the working directory (repository root or renthub/). Real environment
    # variables take precedence over the file.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    # Defaults match the local docker-compose "postgres" service (development only; D-54).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/renthub}
    username: ${DB_USERNAME:renthub}
    password: ${DB_PASSWORD:renthub}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      # Rate limits (NFR-14) and single-use e-mail link tokens (FR-1, FR-3a) live in Redis with TTLs.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: uk
    locale-resolver: fixed
  servlet:
    multipart:
      # Videos up to 50 MB (D-52); photos are still limited to 5 MB by the photo service.
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
    scheduling:
      thread-name-prefix: sched-
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8080}
  # Behind Nginx: trust X-Forwarded-* from the proxy (Tomcat RemoteIpValve, internal addresses only).
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        name: RENTHUB_SESSION
        http-only: true
        same-site: lax
        # NFR-4: switch on (SESSION_COOKIE_SECURE=true) once the site is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # E-mail is an asynchronous, best-effort side effect; an unreachable SMTP server must not mark the app DOWN.
      enabled: false

logging:
  level:
    com.bohakka.renthub: ${LOG_LEVEL:DEBUG}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  time-zone: Europe/Kyiv
  # FR-2a: the single preset administrator (config.AdminAccountConfig), created at start-up when no ADMIN exists.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Адміністратор}
  # FR-4a: S3-compatible object storage for listing photos (SeaweedFS from docker-compose by default, D-33).
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:renthub-photos}
    access-key: ${S3_ACCESS_KEY:renthub}
    secret-key: ${S3_SECRET_KEY:renthub-local-secret}
    # Base URL under which stored objects are publicly readable (the bucket allows anonymous download).
    public-url: ${S3_PUBLIC_URL:http://localhost:8333/renthub-photos}
  # FR-4, NFR-13: OpenStreetMap Nominatim; its policy requires an identifying User-Agent and <= 1 request/second.
  geocoding:
    url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_USER_AGENT:RentHub/0.1}
    country-codes: ua
  # FR-10...FR-15b: booking rules and the scheduler jobs (cron fields: second minute hour day month weekday).
  booking:
    min-lead-days: ${BOOKING_MIN_LEAD_DAYS:1}
    horizon-days: ${BOOKING_HORIZON_DAYS:365}
    request-ttl: ${BOOKING_REQUEST_TTL:48h}
    complete-cron: "0 5 0 * * *"
    expire-cron: "0 0 * * * *"
  # FR-16, FR-17: start city for guests and as a fallback (another city = configuration), radius and count.
  recommendations:
    start-city: ${START_CITY:Львів}
    start-lat: ${START_CITY_LAT:49.8397}
    start-lon: ${START_CITY_LON:24.0297}
    radius-km: ${RECOMMENDATION_RADIUS_KM:25}
    limit: ${RECOMMENDATION_LIMIT:12}
  # FR-18: review window after completion, reply window after publication, and the job publishing expired windows.
  review:
    window: ${REVIEW_WINDOW:14d}
    reply-window: ${REVIEW_REPLY_WINDOW:14d}
    publish-cron: "0 15 * * * *"
  # FR-15a: failed e-mails are retried in memory on the async mail thread (D-41); pauses before the 2nd and 3rd attempt.
  mail:
    retry:
      attempts: ${MAIL_RETRY_ATTEMPTS:3}
      backoff: 10s,60s
  # NFR-14: "limit" attempts per "window"; reaching the limit locks the key for another window.
  rate-limit:
    login:
      limit: ${RATE_LIMIT_LOGIN:5}
      window: 15m
    registration:
      limit: ${RATE_LIMIT_REGISTRATION:5}
      window: 1h
    password-reset:
      limit: ${RATE_LIMIT_PASSWORD_RESET:3}
      window: 1h
    resend-verification:
      limit: ${RATE_LIMIT_RESEND_VERIFICATION:3}
      window: 1h
