plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bohakka'
version = '0.0.1-SNAPSHOT'
description = 'RentHub - peer-to-peer equipment rental platform (backend)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// S3 client for photo storage (FR-4a): any S3-compatible service, MinIO locally. Apache-2.0.
	implementation 'software.amazon.awssdk:s3:2.57.10'

	// The only database (D-47, D-54): PostgreSQL JDBC driver (BSD-2-Clause) and Flyway's PostgreSQL support (Apache-2.0).
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

// No backend tests by project policy (see CLAUDE.md, rule 1.2).
tasks.named('test') {
	enabled = false
}

