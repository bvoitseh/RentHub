plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bohakka'
version = '0.0.1-SNAPSHOT'
description = 'RentHub - peer-to-peer equipment rental platform (backend)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

// No backend tests by project policy (see CLAUDE.md, rule 1.2).
tasks.named('test') {
	enabled = false
}

// `./gradlew bootRun` exports the variables from the repository-root `.env` (git-ignored, see `.env.example`)
// to the process; variables already present in the shell environment win.
tasks.named('bootRun') {
	environment(dotEnv(rootDir.parentFile.toPath().resolve('.env').toFile()))
}

static Map<String, String> dotEnv(File file) {
	if (!file.isFile()) {
		return [:]
	}
	def vars = [:]
	file.readLines('UTF-8').each { line ->
		def trimmed = line.trim()
		if (trimmed.isEmpty() || trimmed.startsWith('#') || !trimmed.contains('=')) {
			return
		}
		def (key, rest) = trimmed.split('=', 2)
		def value = rest.replaceFirst(/\s+#.*$/, '').trim()
		if (value.length() >= 2 && (value.startsWith('"') && value.endsWith('"') || value.startsWith("'") && value.endsWith("'"))) {
			value = value[1..-2]
		}
		if (System.getenv(key.trim()) == null) {
			vars[key.trim()] = value
		}
	}
	return vars
}
