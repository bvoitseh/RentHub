# Production stack (NFR-2, NFR-4, D-47): Nginx (SPA + reverse proxy), Spring Boot, Redis and SeaweedFS (S3 photos).
# PostgreSQL is NOT part of this file: the backend uses an existing PostgreSQL server through DB_URL.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The repository-root .env (git-ignored, read by Compose automatically; D-55) holds every setting and secret; see
# README, "Deploy". To reach PostgreSQL on a Docker
# network instead of the host, add -f docker-compose.prod.pgnet.yml (README).
# Own project name: the local docker-compose.yml in the same directory uses services with the same names, and
# without it Compose would treat both files as one project (and share containers and volumes).
name: renthub-prod

services:
  backend:
    build: ./renthub
    image: renthub-backend
    container_name: renthub-backend
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_HOST: redis
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      # DB_URL=jdbc:postgresql://host.docker.internal:5432/renthub reaches PostgreSQL published on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: renthub-frontend
    container_name: renthub-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
      CSP_IMG_SRC_EXTRA: ${CSP_IMG_SRC_EXTRA:-}
      NGINX_ENVSUBST_FILTER: "^(S3_BUCKET|CSP_IMG_SRC_EXTRA)$$"
    volumes:
      - ./infra/nginx/renthub.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:8.2.11-alpine
    container_name: renthub-prod-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Listing photos (FR-4a): SeaweedFS, Apache-2.0. Another S3 provider can be used through S3_* in .env.
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: renthub-prod-s3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/prod-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
    volumes:
      - s3-data:/data
      - ./infra/seaweedfs/prod-entrypoint.sh:/prod-entrypoint.sh:ro

  s3-init:
    image: chrislusf/seaweedfs:4.50
    container_name: renthub-prod-s3-init
    depends_on:
      - s3
    environment:
      S3_BUCKET: ${S3_BUCKET:-renthub-photos}
      S3_CHAT_BUCKET: ${S3_CHAT_BUCKET:-renthub-chat}
    volumes:
      - ./infra/seaweedfs/create-bucket.sh:/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/create-bucket.sh"]

volumes:
  redis-data:
  s3-data:
